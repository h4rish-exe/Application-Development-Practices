<!DOCTYPE html>
<html>
    <head>
        <title>CSS grid example</title>
    </head>
    <style>
        .container {
            text-align: center;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto;
            grid-gap: 25px;
            background-color: rgb(212, 87, 104);
            border: solid 6px rgb(36, 213, 213);
        }
        .top {
            text-align: center;
            background-color: rgb(107, 107, 168);
        }
        .mid {
            text-align: left;
            background-color: coral;
        }
        .mid2 {
            text-align: end;
            background-color: rgb(171, 201, 122);
        }
        .bot {
            text-align: center;
            background-color: blanchedalmond;
        }
    </style>
    <body>
        <div class= "container"> <br>
            <div class= "top">SKCET</div> <br>
            <div class= "mid">ECE</div> <div class="mid2">B</div> <br>
            <div class="bot">STUDENT</div>
        </div>
    </body>
</html>
