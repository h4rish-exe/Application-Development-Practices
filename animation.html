<!DOCTYPE html>
<html>
<head>
    <title>Animated Clock</title>

    <style>
        body {
            background: lightblue;
        }

        .clock {
            width: 300px;
            height: 300px;
            border: 8px solid black;
            border-radius: 50%;
            background: white;
            margin: 50px auto;
            position: relative;
        }

        .number {
            position: absolute;
            font-size: 25px;
            font-weight: bold;
        }

        .n12 { top: 10px; left: 135px; }
        .n1  { top: 30px; left: 205px; }
        .n2  { top: 75px; left: 250px; }
        .n3  { top: 135px; left: 270px; }
        .n4  { top: 200px; left: 250px; }
        .n5  { top: 250px; left: 205px; }
        .n6  { top: 270px; left: 140px; }
        .n7  { top: 250px; left: 75px; }
        .n8  { top: 200px; left: 30px; }
        .n9  { top: 135px; left: 15px; }
        .n10 { top: 75px; left: 25px; }
        .n11 { top: 30px; left: 75px; }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
        }

        .hour {
            width: 7px;
            height: 70px;
            background: black;
            animation: hour 43200s linear infinite;
        }

        .minute {
            width: 5px;
            height: 100px;
            background: blue;
            animation: minute 3600s linear infinite;
        }

        .second {
            width: 2px;
            height: 120px;
            background: red;
            animation: second 60s steps(60) infinite;
        }

        @keyframes second {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes minute {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes hour {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="clock">

    <div class="number n12">12</div>
    <div class="number n1">1</div>
    <div class="number n2">2</div>
    <div class="number n3">3</div>
    <div class="number n4">4</div>
    <div class="number n5">5</div>
    <div class="number n6">6</div>
    <div class="number n7">7</div>
    <div class="number n8">8</div>
    <div class="number n9">9</div>
    <div class="number n10">10</div>
    <div class="number n11">11</div>

    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>

</div>

</body>
</html>
