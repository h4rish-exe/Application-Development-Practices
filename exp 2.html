<!DOCTYPE html>
<html>
<head>
<title>Movie World</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background-image: url("https://images.unsplash.com/photo-1717915604557-94283edbcc1b?fm=jpg&q=70&w=2000&auto=format&fit=crop");
  background-size: cover;
  background-position: center;
}

.container {
  background: rgba(0, 0, 0, 0.75);
  width: 320px;
  padding: 25px;
  text-align: center;
  border-radius: 20px;
  color: white;
}

.container h2 {
  margin-bottom: 20px;
}

.container img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 15px;
}

.container p {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 20px;
}

.container button {
  padding: 10px 24px;
  border: 1px solid white;
  border-radius: 25px;
  background: transparent;
  color: white;
  cursor: pointer;
}

.container button:hover {
  background: white;
  color: black;
}
</style>
</head>
<body>
  <div class="container">
    <h2>Welcome to the World of Cinema...</h2>
    <img src="https://images.unsplash.com/photo-1759230766134-e3ff1c27d20e?fm=jpg&q=70&w=900&auto=format&fit=crop" alt="Movie Theater">
    <p>Cinema is a matter of what's in the frame and what's out.
      — Martin Scorsese</p>
    <button>Explore More</button>
  </div>
</body>
</html>
