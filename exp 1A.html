<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>

<style>
* {
  box-sizing: border-box;
}
body, html {
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
  margin: 0;
  padding: 0;
}
.main-panel {
  width: 100%;
  max-width: 600px;
  margin: 60px auto;
  background: #fff;
  padding: 30px 20px 50px 20px;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
h1 {
  font-size: 32px;
  text-align: center;
  margin: 0;
  color: #333;
  letter-spacing: 1px;
}
.row {
  display: flex;
  gap: 15px;
}
.form-group {
  margin-top: 20px;
  flex-direction: column;
  display: flex;
  width: 100%;
}
label {
  font-weight: bold;
  margin-bottom: 5px;
  color: #444;
}
input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 15px;
  transiktion: 0.3s;
}
input:focus, select:focus, textarea:focus {
  border-color: #4a90e2;
  outline: none;
  box-shadow: 0 0 5px rgba(74,144,226,0.5);
}
input[type="radio"], input[type="checkbox"] {
  width: auto;
  margin-left: 8px;
}
button {
  border: none;
  width: 100%;
  height: 45px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 35px;
  border-radius: 6px;
  background: linear-gradient(135deg, #ff6a6a, #ff3c3c);
  color: white;
  font-weight: bold;
  transition: 0.3s;
}
button:hover {
  background: linear-gradient(135deg, #ff3c3c, #d60000);
}
/* Mobile Version */
@media screen and (max-width: 600px) {
  .row {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>
<div class="main-panel">
  <h1>Student Registration Form</h1>
  
  <div class="row">
    <div class="form-group">
      <label>Student Name</label>
      <input type="text" placeholder="Enter your full name" />
    </div>
  </div>
  
  <div class="row">
    <div class="form-group">
      <label>Mobile No.</label>
      <input type="text" placeholder="e.g. 9876543210" />
    </div>
    <div class="form-group">
      <label>Email Id</label>
      <input type="email" placeholder="example@mail.com" />
    </div>
  </div>
  
  <div class="row">
    <div class="form-group">
      <label>Father Name</label>
      <input type="text" />
    </div>
    <div class="form-group">
      <label>Mother Name</label>
      <input type="text" />
    </div>
  </div>
  
  <div class="row">
    <div class="form-group">
      <label>Select Course</label>
      <select>
        <option>Select...</option>
        <option>HTML</option>
        <option>CSS</option>
        <option>Java</option>
        <option>Python</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date Of Birth</label>
      <input type="date" />
    </div>
  </div>
  
  <div class="row">
    <div class="form-group">
      <label>Gender</label>
      <div>
        <input type="radio" name="g" /> Male
        <input type="radio" name="g" /> Female
      </div>
    </div>
  </div>
  
  <div class="row">
    <div class="form-group">
      <label>Select Branch</label>
      <div>
        <input type="checkbox" /> CSE
        <input type="checkbox" /> IT
        <input type="checkbox" /> ECE
        <input type="checkbox" /> Civil
      </div>
    </div>
  </div>
  
  <div class="row">
    <div class="form-group">
      <label>Address</label>
      <textarea style="height:110px;" placeholder="Enter your address"></textarea>
    </div>
  </div>
  
  <div class="row">
    <button type="submit">Submit</button>
  </div>
</div>
</body>
</html>
